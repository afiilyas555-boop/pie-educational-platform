<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PIE - Support PDF</title>


    <style>

        /* ================= GENERAL ================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #333;
        }


        /* ================= ZONE SOURIS ================= */

        /*
            Petite zone invisible en haut de l'écran.
            Quand la souris entre ici,
            la navbar apparaît.
        */

        .top-zone {

            position: fixed;

            top: 0;

            left: 0;

            width: 100%;

            height: 15px;

            z-index: 2000;
        }


        /* ================= NAVBAR ================= */

        nav {

            height: 70px;

            background: linear-gradient(
                135deg,
                #4a148c,
                #7b1fa2
            );

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 6%;

            position: fixed;

            top: 0;

            left: 0;

            width: 100%;

            z-index: 1000;

            /*
                Navbar cachée au début
            */

            transform: translateY(-100%);

            transition: transform 0.3s ease;

            box-shadow:
                0 3px 15px rgba(0, 0, 0, 0.2);
        }


        .logo {

            color: white;

            font-size: 25px;

            font-weight: bold;
        }


        .logo span {

            color: #ffb74d;
        }


        .nav-links {

            display: flex;

            gap: 25px;
        }


        .nav-links a {

            color: white;

            text-decoration: none;

            font-weight: bold;

            transition: 0.3s;
        }


        .nav-links a:hover {

            color: #ffb74d;
        }


        /* ================= HERO ================= */

        .hero {

            margin-top: 0;

            min-height: 280px;

            background:

                linear-gradient(
                    rgba(74, 20, 140, 0.85),
                    rgba(123, 31, 162, 0.80)
                ),

                url("img/images (7).jpeg");

            background-position: center;

            background-size: cover;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 40px 20px;
        }


        .hero-content {

            color: white;
        }


        .hero h1 {

            font-size: 50px;

            margin-bottom: 15px;
        }


        .hero h1 span {

            color: #ffb74d;
        }


        .hero p {

            font-size: 19px;
        }


        /* ================= PDF SECTION ================= */

        .pdf-section {

            width: 92%;

            max-width: 1200px;

            margin: 50px auto;
        }


        .section-title {

            text-align: center;

            margin-bottom: 25px;
        }


        .section-title h2 {

            color: #4a148c;

            font-size: 30px;

            margin-bottom: 10px;
        }


        .section-title p {

            color: #666;
        }


        /* ================= PDF CARD ================= */

        .pdf-card {

            background: white;

            padding: 15px;

            border-radius: 20px;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.12);
        }


        iframe {

            width: 100%;

            height: 900px;

            border: none;

            border-radius: 12px;

            display: block;
        }


        /* ================= FULL SCREEN BUTTON ================= */

        .fullscreen-container {

            text-align: right;

            margin-bottom: 15px;
        }


        .fullscreen-btn {

            background:

                linear-gradient(
                    135deg,
                    #6a1b9a,
                    #9c27b0
                );

            color: white;

            border: none;

            padding: 12px 22px;

            border-radius: 25px;

            font-weight: bold;

            cursor: pointer;

            font-size: 15px;

            transition: 0.3s;

            box-shadow:
                0 5px 15px rgba(106, 27, 154, 0.25);
        }


        .fullscreen-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(106, 27, 154, 0.35);
        }


        /* ================= RETURN BUTTON ================= */

        .button-container {

            text-align: center;

            margin: 35px 0 60px;
        }


        .back-btn {

            display: inline-block;

            text-decoration: none;

            background:

                linear-gradient(
                    135deg,
                    #6a1b9a,
                    #9c27b0
                );

            color: white;

            padding: 14px 30px;

            border-radius: 30px;

            font-weight: bold;

            transition: 0.3s;

            box-shadow:
                0 5px 15px rgba(106, 27, 154, 0.3);
        }


        .back-btn:hover {

            transform: translateY(-3px);

            box-shadow:
                0 8px 20px rgba(106, 27, 154, 0.4);
        }


        /* ================= FOOTER ================= */

        footer {

            background: #2b1748;

            color: white;

            text-align: center;

            padding: 25px;

            margin-top: 50px;
        }


        footer strong {

            color: #ffb74d;
        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 768px) {

            nav {

                padding: 0 20px;
            }


            .nav-links {

                gap: 10px;
            }


            .nav-links a {

                font-size: 13px;
            }


            .hero {

                min-height: 250px;
            }


            .hero h1 {

                font-size: 38px;
            }


            .hero p {

                font-size: 16px;
            }


            .pdf-section {

                width: 95%;
            }


            iframe {

                height: 700px;
            }

        }


        /* ================= MOBILE ================= */

        @media (max-width: 500px) {

            nav {

                height: auto;

                padding: 18px;

                flex-direction: column;

                gap: 12px;
            }


            .nav-links {

                flex-wrap: wrap;

                justify-content: center;
            }


            .hero {

                min-height: 250px;
            }


            .hero h1 {

                font-size: 32px;
            }


            iframe {

                height: 600px;
            }


            .fullscreen-container {

                text-align: center;
            }

        }

    </style>

</head>


<body>


    <!-- ================= ZONE SOURIS ================= -->

    <!--
        Zone invisible en haut.
        Place la souris tout en haut
        pour afficher la navbar.
    -->

    <div class="top-zone"></div>



    <!-- ================= NAVBAR ================= -->

    <nav>

        <div class="logo">

            PIE <span>OFPPT</span>

        </div>


        <div class="nav-links">
            <a href="pie.html">Accueil</a>
            <a href="intro.html">pour moi</a>
           
            <a href="entrop.html">Entrepreneurs</a>

        </div>

    </nav>



    <!-- ================= HERO ================= -->

    <section class="hero">

        <div class="hero-content">

            <h1>

                Support <span>PIE</span>

            </h1>


            <p>

                Support pédagogique du Programme
                d'Innovation Entrepreneuriale

            </p>

        </div>

    </section>



    <!-- ================= PDF ================= -->

    <section class="pdf-section">


        <div class="section-title">

            <h2>

                📚 Support PDF

            </h2>


            <p>

                Consultez directement le support pédagogique du PIE.

            </p>

        </div>



        <div class="pdf-card">


            <!-- ================= FULL SCREEN BUTTON ================= -->

            <div class="fullscreen-container">

                <button
                    class="fullscreen-btn"
                    onclick="openFullscreen()">

                    ⛶ Plein écran

                </button>

            </div>



            <!-- ================= PDF ================= -->

            <iframe

                id="pdfViewer"

                src="img/PIE-A1-P1-Séance 1- support Stagiaires (1).pdf">

            </iframe>


        </div>

    </section>



    <!-- ================= RETURN BUTTON ================= -->

    <div class="button-container">

        <a
            href="pie.html"
            class="back-btn">

            ← Retour à l'interface

        </a>

    </div>



    <!-- ================= FOOTER ================= -->

    <footer>

        <p>

            © 2026

            <strong>
                PIE OFPPT
            </strong>

            -

            Projet d'Innovation Entrepreneuriale

        </p>

    </footer>



    <!-- ================= JAVASCRIPT ================= -->

    <script>


        /* ==================================================
           NAVBAR
           ================================================== */


        const nav =
            document.querySelector("nav");


        const topZone =
            document.querySelector(".top-zone");


        /*
            Navbar cachée au début
        */

        nav.style.transform =
            "translateY(-100%)";


        /*
            Quand la souris arrive
            tout en haut de l'écran
        */

        topZone.addEventListener(
            "mouseenter",
            function () {

                nav.style.transform =
                    "translateY(0)";

            }
        );


        /*
            Quand la souris entre dans la navbar,
            elle reste affichée.
        */

        nav.addEventListener(
            "mouseenter",
            function () {

                nav.style.transform =
                    "translateY(0)";

            }
        );


        /*
            Quand la souris sort de la navbar,
            elle disparaît.
        */

        nav.addEventListener(
            "mouseleave",
            function () {

                nav.style.transform =
                    "translateY(-100%)";

            }
        );



        /* ==================================================
           FULL SCREEN PDF
           ================================================== */


        function openFullscreen() {


            const pdf =
                document.getElementById("pdfViewer");


            /*
                Chrome / Edge / Firefox
            */

            if (pdf.requestFullscreen) {

                pdf.requestFullscreen();

            }


            /*
                Safari
            */

            else if (pdf.webkitRequestFullscreen) {

                pdf.webkitRequestFullscreen();

            }


            /*
                Internet Explorer / anciens navigateurs
            */

            else if (pdf.msRequestFullscreen) {

                pdf.msRequestFullscreen();

            }

        }


    </script>


</body>

</html>
